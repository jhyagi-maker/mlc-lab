# 홈 화면 큰 제목 아래에 나오는 한두 문장 소개
tagline: 머신러닝으로 부식을 읽고 예측하며, 표면처리 기술로 부식을 막습니다.

# 홈 화면 '연구실 소개' 문단 (여러 줄로 써도 됩니다. 앞의 '|' 기호는 지우지 마세요)
intro: |
  MLC Lab은 머신러닝과 부식 공학을 결합하는 연구실입니다.
  딥러닝 영상 분석으로 부식의 시작과 진행을 비접촉·비파괴로 모니터링하고,
  해양 설비와 공정 설비의 부식을 줄이기 위한 표면처리·코팅 공정을 개발하여
  전기화학 시험으로 그 원리를 검증합니다.

# 연구 분야 (항목 추가: '- title:' 부터 두 줄을 복사해서 아래에 붙이기)
research:
  - title: AI 영상 분석 기반 부식 모니터링
    summary: U-Net, SAM(Segment Anything) 등 딥러닝 영상 분할과 색공간 분석으로 부식 영역을 자동 검출하고, 장기 침지·대기 환경에서 부식 진행을 정량화합니다.
  - title: 부식방식 코팅 및 패시베이션
    summary: 몰리브데이트 전해질에서의 부동태 피막 형성, 스퍼터링 Cu–Ni–Al 박막의 피팅 억제 등 표면처리 기술의 내식성 향상 메커니즘을 전기화학 시험으로 규명합니다.
  - title: 해양구조물 음극방식 및 석회질 피막
    summary: 음극방식법으로 강판 위에 탄산칼슘(석회질) 피막을 전착시키고, 굴 패각 같은 폐자원을 활용한 친환경 해양구조물 보호 기술을 연구합니다.
  - title: 에너지 소재 및 친환경 연료
    summary: 리튬이온전지용 유연 전극 소재, 바이오 중유 사용에 따른 연료계 재료의 부식, 고탄소 알코올 혼합 연료의 엔진 특성을 연구합니다.

